name: 🚀 Vendor Release Controller (Enterprise Orchestrator)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "detect | validate | notify | update-catalog | generate-summary"
        required: true
        default: "detect"
      vendor:
        description: "Target vendor (ubuntu | rhel | amazonlinux | all)"
        required: true
        default: "all"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      action: ${{ github.event.inputs.action }}
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ Only manual triggers allowed"
            exit 1
          fi
          echo "✅ Manual trigger verified"
          echo "Action selected: ${{ github.event.inputs.action }}"
          echo "Vendor selected: ${{ github.event.inputs.vendor }}"

  controller:
    name: Execute Vendor Release Operations
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vendor: [ubuntu, rhel, amazonlinux]
      max-parallel: 3
    if: ${{ needs.guard.outputs.vendor == 'all' || needs.guard.outputs.vendor == matrix.vendor }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###############################################################
      # Sequential Action Orchestration (Per Vendor)
      ###############################################################

      # 1️⃣ DETECT
      - name: 🔍 Detect Vendor Release
        if: ${{ needs.guard.outputs.action == 'detect' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: detect

      # 2️⃣ VALIDATE
      - name: 🧪 Validate Vendor Image Compliance
        if: ${{ needs.guard.outputs.action == 'validate' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: validate

      # 3️⃣ NOTIFY (JIRA)
      - name: 📩 Notify JIRA (New Release Detected)
        if: ${{ needs.guard.outputs.action == 'notify' }}
        uses: ./actions/jira-notify
        with:
          vendor: ${{ matrix.vendor }}
          version: "latest"
          old_version: "previous"

      # 4️⃣ UPDATE CATALOG
      - name: 🗂️ Update Vendor Catalog
        if: ${{ needs.guard.outputs.action == 'update-catalog' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: update-catalog

      # 5️⃣ GENERATE SUMMARY
      - name: 📊 Generate Summary Report
        if: ${{ needs.guard.outputs.action == 'generate-summary' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: generate-summary

  finalize:
    name: 🧾 Consolidate & Finalize
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Merge Reports
        run: |
          mkdir -p reports/final
          echo "Combining individual vendor reports into one unified compliance summary..."
          if ls reports/*-summary.json 1> /dev/null 2>&1; then
            jq -s '.' reports/*-summary.json > reports/final/compliance-summary.json
            echo "✅ Final report created at reports/final/compliance-summary.json"
          else
            echo "⚠️ No summary reports found to merge"
          fi

      - name: Upload Final Summary
        if: hashFiles('reports/final/compliance-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unified-compliance-summary
          path: reports/final/compliance-summary.json