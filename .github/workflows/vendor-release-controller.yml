name: 🚀 Vendor Release Controller (Strict Sequential – One Vendor)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Select vendor (ubuntu | rhel | amazonlinux)"
        required: true
        default: "ubuntu"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ Only manual triggers allowed"
            exit 1
          fi
          echo "✅ Manual trigger verified."
          echo "Vendor selected: ${{ github.event.inputs.vendor }}"

  controller:
    name: Execute Vendor Compliance Pipeline
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###############################################################
      # 1️⃣ DETECT
      ###############################################################
      - name: 🔍 Detect Vendor Release
        id: detect
        run: |
          echo "Running detection for ${{ github.event.inputs.vendor }}..."
          python3 connectors/${{ github.event.inputs.vendor }}/api_client.py || exit 1
          echo "✅ Detection successful."

      ###############################################################
      # 2️⃣ VALIDATE
      ###############################################################
      - name: 🧪 Validate CIS and Security Compliance
        id: validate
        run: |
          echo "Running validation for ${{ github.event.inputs.vendor }}..."
          # Placeholder for CIS or Trivy validation commands
          echo "✅ Validation passed."

      ###############################################################
      # 3️⃣ NOTIFY (JIRA)
      ###############################################################
      - name: 📩 Notify JIRA
        id: notify
        uses: ./actions/jira-notify
        with:
          vendor: ${{ github.event.inputs.vendor }}
          version: "latest"
          old_version: "previous"

      ###############################################################
      # 4️⃣ UPDATE CATALOG
      ###############################################################
      - name: 🗂️ Update Vendor Catalog
        id: update
        uses: ./actions/${{ github.event.inputs.vendor }}-detect
        with:
          vendor: ${{ github.event.inputs.vendor }}
          action: update-catalog

      ###############################################################
      # 5️⃣ GENERATE SUMMARY
      ###############################################################
      - name: 📊 Generate Compliance Summary
        id: summary
        uses: ./actions/${{ github.event.inputs.vendor }}-detect
        with:
          vendor: ${{ github.event.inputs.vendor }}
          action: generate-summary

  finalize:
    name: 🧾 Post-Operation Summary
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Verify reports exist
        run: |
          if ls reports/*summary.json >/dev/null 2>&1; then
            echo "✅ Reports found"
          else
            echo "❌ No reports generated. Failing pipeline."
            exit 1
          fi

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.vendor }}-compliance-report"
          path: reports/
