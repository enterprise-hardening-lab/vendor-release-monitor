name: 🚀 Vendor Release Controller (Enterprise Orchestrator)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "detect | validate | notify | update-catalog | generate-summary"
        required: true
        default: "detect"
      vendor:
        description: "Target vendor (ubuntu | rhel | amazonlinux | all)"
        required: true
        default: "all"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      action: ${{ github.event.inputs.action }}
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ Only manual triggers allowed"
            exit 1
          fi
          echo "✅ Manual trigger verified"
          echo "Action selected: ${{ github.event.inputs.action }}"
          echo "Vendor selected: ${{ github.event.inputs.vendor }}"

  controller:
    name: Execute Vendor Release Operations
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vendor: [ubuntu, rhel, amazonlinux]
      max-parallel: 3
    if: ${{ needs.guard.outputs.vendor == 'all' || needs.guard.outputs.vendor == matrix.vendor }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- D E T E C T ---
      - name: 🧩 Detect Vendor Release
        if: ${{ needs.guard.outputs.action == 'detect' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: detect

      # --- V A L I D A T E ---
      - name: 🧪 Validate CIS & Security Baselines
        if: ${{ needs.guard.outputs.action == 'validate' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: validate

      # --- N O T I F Y ---
      - name: 📩 Notify via JIRA
        if: ${{ needs.guard.outputs.action == 'notify' }}
        uses: ./actions/jira-notify
        with:
          vendor: ${{ matrix.vendor }}
          version: "latest"
          old_version: "previous"

      # --- U P D A T E  -  C A T A L O G ---
      - name: 🗂️ Update Vendor Catalog
        if: ${{ needs.guard.outputs.action == 'update-catalog' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: update-catalog

      # --- G E N E R A T E  -  S U M M A R Y ---
      - name: 📊 Generate Summary Report
        if: ${{ needs.guard.outputs.action == 'generate-summary' }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: generate-summary

  finalize:
    name: Post-Operation Summary
    runs-on: ubuntu-latest
    needs: controller
    steps:
      - name: 🧾 Print final summary
        run: |
          echo "✅ Operation completeed for action: ${{ github.event.inputs.action }}"
          echo "🏷️ Vendors processed: ${{ github.event.inputs.vendor }}"
