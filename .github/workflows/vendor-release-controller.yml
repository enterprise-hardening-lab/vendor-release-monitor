name: 🚀 Vendor Release Controller (Manual Only – Composite Action Version)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "detect | validate | notify | update-catalog | generate-summary"
        required: true
        default: "detect"
      vendor:
        description: "Target vendor (ubuntu | rhel | amazonlinux)"
        required: true
        default: "ubuntu"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Check Event
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ This workflow must be manually triggered."
            exit 1
          fi
          echo "✅ Manual trigger verified."

  detect:
    name: Vendor Detection
    needs: guard
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'detect' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🐧 Ubuntu Vendor Detection
        if: ${{ github.event.inputs.vendor == 'ubuntu' }}
        uses: ./.github/actions/ubuntu-detect

      - name: 🔵 RHEL Vendor Detection
        if: ${{ github.event.inputs.vendor == 'rhel' }}
        uses: ./.github/actions/rhel-detect

      - name: 🟣 Amazon Linux Vendor Detection
        if: ${{ github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./.github/actions/amazonlinux-detect