name: 🚀 Vendor Release Controller (Enterprise Orchestrator)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "detect | validate | notify | update-catalog | generate-summary"
        required: true
        default: "detect"
      vendor:
        description: "Target vendor (ubuntu | rhel | amazonlinux | all)"
        required: true
        default: "all"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ Only manual triggers allowed"
            exit 1
          fi
          echo "✅ Manual trigger verified."
          echo "Vendor selected: ${{ github.event.inputs.vendor }}"

  controller:
    name: Execute Vendor Release Operations
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###############################################################
      # Ubuntu sequence
      ###############################################################
      - name: 🔍 Detect Ubuntu
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: detect

      - name: 🧪 Validate Ubuntu
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: validate

      - name: 📩 Notify Ubuntu JIRA
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'ubuntu' }}
        uses: ./actions/jira-notify
        with:
          vendor: ubuntu
          version: "latest"
          old_version: "previous"

      - name: 🗂️ Update Ubuntu Catalog
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: update-catalog

      - name: 📊 Ubuntu Summary
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: generate-summary

      ###############################################################
      # RHEL sequence
      ###############################################################
      - name: 🔍 Detect RHEL
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: detect

      - name: 🧪 Validate RHEL
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: validate

      - name: 📩 Notify RHEL JIRA
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'rhel' }}
        uses: ./actions/jira-notify
        with:
          vendor: rhel
          version: "latest"
          old_version: "previous"

      - name: 🗂️ Update RHEL Catalog
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: update-catalog

      - name: 📊 RHEL Summary
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: generate-summary

      ###############################################################
      # Amazon Linux sequence
      ###############################################################
      - name: 🔍 Detect Amazon Linux
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: detect

      - name: 🧪 Validate Amazon Linux
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: validate

      - name: 📩 Notify Amazon Linux JIRA
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./actions/jira-notify
        with:
          vendor: amazonlinux
          version: "latest"
          old_version: "previous"

      - name: 🗂️ Update Amazon Linux Catalog
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: update-catalog

      - name: 📊 Amazon Linux Summary
        if: ${{ github.event.inputs.vendor == 'all' || github.event.inputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: generate-summary

  finalize:
    name: 🧾 Consolidate & Finalize
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Merge Reports
        run: |
          mkdir -p reports/final
          echo "Combining individual vendor reports into one unified compliance summary..."
          jq -s '.' reports/*-summary.json > reports/final/compliance-summary.json
          echo "✅ Final report created at reports/final/compliance-summary.json"

      - name: Upload Final Summary
        uses: actions/upload-artifact@v4
        with:
          name: unified-compliance-summary
          path: reports/final/compliance-summary.json
