name: 🚀 Vendor Release Controller (Sequential Multi-Action Workflow)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Target vendor (ubuntu | rhel | amazonlinux | all)"
        required: true
        default: "all"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Verify Event
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ This workflow must be manually triggered."
            exit 1
          fi
          echo "✅ Manual trigger verified."
          echo "Selected Vendor: ${{ github.event.inputs.vendor }}"

  orchestrate:
    name: 🧩 Sequential Vendor Operations
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vendor: [ubuntu, rhel, amazonlinux]
      max-parallel: 1   # runs one vendor at a time
    if: ${{ needs.guard.outputs.vendor == 'all' || needs.guard.outputs.vendor == matrix.vendor }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #####################################################
      # 1️⃣ DETECT
      #####################################################
      - name: 🔍 Detect Release for ${{ matrix.vendor }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: detect

      #####################################################
      # 2️⃣ VALIDATE
      #####################################################
      - name: 🧪 Validate ${{ matrix.vendor }} Image Compliance
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: validate

      #####################################################
      # 3️⃣ NOTIFY
      #####################################################
      - name: 📩 Notify via JIRA for ${{ matrix.vendor }}
        uses: ./actions/jira-notify
        with:
          vendor: ${{ matrix.vendor }}
          version: "latest"
          old_version: "previous"

      #####################################################
      # 4️⃣ UPDATE CATALOG
      #####################################################
      - name: 🗂️ Update Catalog for ${{ matrix.vendor }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: update-catalog

      #####################################################
      # 5️⃣ GENERATE SUMMARY
      #####################################################
      - name: 📊 Generate Summary Report for ${{ matrix.vendor }}
        uses: ./actions/${{ matrix.vendor }}-detect
        with:
          vendor: ${{ matrix.vendor }}
          action: generate-summary

  finalize:
    name: 🧾 Consolidate & Finalize
    needs: orchestrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Merge Reports
        run: |
          mkdir -p reports/final
          echo "Combining individual vendor reports into one unified compliance summary..."
          jq -s '.' reports/*-summary.json > reports/final/compliance-summary.json
          echo "✅ Final report created at reports/final/compliance-summary.json"

      - name: Upload Final Summary
        uses: actions/upload-artifact@v4
        with:
          name: unified-compliance-summary
          path: reports/final/compliance-summary.json
