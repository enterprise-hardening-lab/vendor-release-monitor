name: 🚀 Vendor Release Controller (Strict Sequential – One Vendor)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "ubuntu | rhel | amazonlinux"
        required: true
        default: "ubuntu"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Verify Manual Trigger
    runs-on: ubuntu-latest
    outputs:
      vendor: ${{ github.event.inputs.vendor }}
    steps:
      - name: Validate trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "❌ Only manual triggers allowed"
            exit 1
          fi
          echo "✅ Manual trigger verified."
          echo "Vendor selected: ${{ github.event.inputs.vendor }}"

  controller:
    name: Run Vendor Pipeline
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- DETECT ----------------
      - name: 🔍 Detect Ubuntu
        if: ${{ needs.guard.outputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: detect

      - name: 🔍 Detect RHEL
        if: ${{ needs.guard.outputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: detect

      - name: 🔍 Detect Amazon Linux
        if: ${{ needs.guard.outputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: detect

      # ---------------- VALIDATE ----------------
      - name: 🧪 Validate Ubuntu
        if: ${{ needs.guard.outputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: validate

      - name: 🧪 Validate RHEL
        if: ${{ needs.guard.outputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: validate

      - name: 🧪 Validate Amazon Linux
        if: ${{ needs.guard.outputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: validate

      # ---------------- NOTIFY ----------------
      - name: 📩 Notify JIRA
        uses: ./actions/jira-notify
        with:
          vendor: ${{ needs.guard.outputs.vendor }}
          version: "latest"
          old_version: "previous"

      # ---------------- UPDATE ----------------
      - name: 🗂️ Update Catalog Ubuntu
        if: ${{ needs.guard.outputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: update-catalog

      - name: 🗂️ Update Catalog RHEL
        if: ${{ needs.guard.outputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: update-catalog

      - name: 🗂️ Update Catalog AmazonLinux
        if: ${{ needs.guard.outputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: update-catalog

      # ---------------- SUMMARY ----------------
      - name: 📊 Summary Ubuntu
        if: ${{ needs.guard.outputs.vendor == 'ubuntu' }}
        uses: ./actions/ubuntu-detect
        with:
          vendor: ubuntu
          action: generate-summary

      - name: 📊 Summary RHEL
        if: ${{ needs.guard.outputs.vendor == 'rhel' }}
        uses: ./actions/rhel-detect
        with:
          vendor: rhel
          action: generate-summary

      - name: 📊 Summary AmazonLinux
        if: ${{ needs.guard.outputs.vendor == 'amazonlinux' }}
        uses: ./actions/amazonlinux-detect
        with:
          vendor: amazonlinux
          action: generate-summary

  finalize:
    name: 📦 Finalize & Merge Vendor Reports
    runs-on: ubuntu-latest
    needs: [controller]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Vendor Artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/
          pattern: reports-*
          merge-multiple: true

      - name: Merge All Summary Reports
        shell: bash
        run: |
          mkdir -p reports/final
          echo "Combining all vendor summaries..."
          if ls reports/*summary.json >/dev/null 2>&1; then
            jq -s '.' reports/*summary.json > reports/final/compliance-summary.json
            echo "✅ Combined summary created at reports/final/compliance-summary.json"
          else
            echo "⚠️ No summary files found. Creating empty report."
            echo '[]' > reports/final/compliance-summary.json
          fi

      - name: Upload Final Summary
        uses: actions/upload-artifact@v4
        with:
          name: final-compliance-summary
          path: reports/final/compliance-summary.json

      - name: 📩 Create GitHub Issue
        id: notify
        run: |
          echo "🧠 Emitting GitHub issue for detected release..."
          python3 -c "from orchestrator.emit import emit_release_event; emit_release_event('${{ needs.guard.outputs.vendor }}','latest','previous')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

