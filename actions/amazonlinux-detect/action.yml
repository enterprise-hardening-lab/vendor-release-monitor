name: "Amazon Linux Vendor Detection"
description: "Fetches the latest Amazon Linux release and updates catalog"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: pip install requests
      shell: bash

    - name: Run Amazon Linux RSS Fetcher
      run: |
        set +e
        output=$(python3 connectors/amazonlinux/rss_feed.py 2>&1)
        echo "$output"
        version=$(echo "$output" | grep "Latest Amazon" | awk -F': ' '{print $2}')
        if [ -z "$version" ]; then
          echo "⚠️ No version detected; using catalog fallback"
          if [ -f catalog/state/amazonlinux.json ]; then
            version=$(jq -r '.last_version' catalog/state/amazonlinux.json)
          else
            version="unknown"
          fi
        fi
        echo "latest_version=$version" >> $GITHUB_OUTPUT
        echo "Detected Amazon Linux version: $version"
        exit 0
      shell: bash

    - name: Compare and Update Catalog
      run: python3 scripts/compare_versions.py amazonlinux "${{ steps.prep.outputs.latest_version }}"
      shell: bash
