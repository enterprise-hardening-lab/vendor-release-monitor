---
name: "RHEL Vendor Detection"
description: "Fetches the latest RHEL release, validates, updates catalog, and generates structured reports"

inputs:
  vendor:
    description: "Vendor name (rhel)"
    required: true

runs:
  using: "composite"
  steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: pip install requests jq
      shell: bash

    # 4️⃣ Prepare directories
    - name: Ensure directories
      run: mkdir -p reports catalog/state
      shell: bash

    # 5️⃣ DETECTION
    - name: Run RHEL API Client (resilient)
      id: detect
      run: |
        set +e
        echo "🔎 Querying Red Hat Security Data API..."
        output=$(python3 connectors/rhel/api_client.py 2>&1)
        echo "$output"

        version=$(echo "$output" | grep "Latest RHEL version detected" | awk -F': ' '{print $2}')

        if [ -z "$version" ]; then
          echo "⚠️ No version detected; falling back to catalog/state/rhel.json"
          if [ -f catalog/state/rhel.json ]; then
            version=$(jq -r '.last_version' catalog/state/rhel.json)
          else
            version="unknown"
          fi
        fi

        echo "latest_version=$version" >> $GITHUB_OUTPUT
        echo "{\"vendor\": \"rhel\", \"detected_version\": \"$version\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > reports/rhel-detect.json
        echo "✅ Detected RHEL version: $version"
      shell: bash

    # 6️⃣ COMPARE / UPDATE
    - name: Compare and Update Catalog
      id: update
      run: |
        python3 scripts/compare_versions.py rhel "${{ steps.detect.outputs.latest_version }}"
        cp catalog/state/rhel.json reports/rhel-catalog.json
        echo "✅ Catalog comparison complete."
      shell: bash

    # 7️⃣ VALIDATION
    - name: Validate RHEL image
      id: validate
      run: |
        echo "{\"vendor\": \"rhel\", \"validation_status\": \"passed\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > reports/rhel-validate.json
        echo "✅ Validation simulated (replace with Trivy scan later)."
      shell: bash

    # 8️⃣ SUMMARY GENERATION
    - name: Generate RHEL Summary Report
      id: summary
      run: |
        detect_file="reports/rhel-detect.json"
        validate_file="reports/rhel-validate.json"
        catalog_file="reports/rhel-catalog.json"

        jq -n --arg vendor "rhel" \
             --slurpfile detect $detect_file \
             --slurpfile validate $validate_file \
             --slurpfile catalog $catalog_file \
             '{
                vendor: $vendor,
                detect: $detect[0],
                validate: $validate[0],
                catalog: $catalog[0],
                generated_at: (now | todate)
              }' > reports/rhel-summary.json

        echo "✅ Summary report created: reports/rhel-summary.json"
      shell: bash

    # 9️⃣ UPLOAD REPORTS (retry-safe)
    - name: Upload RHEL Reports (resilient)
      uses: nick-fields/retry@v3
      with:
        max_attempts: 5
        retry_wait_seconds: 15
        timeout_minutes: 5
        command: |
          artifact_name="reports-${{ inputs.vendor }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.job }}-${{ github.run_id }}"
          echo "🧩 Uploading artifact: $artifact_name"
          gh run upload-artifact "$artifact_name" reports/ || true
