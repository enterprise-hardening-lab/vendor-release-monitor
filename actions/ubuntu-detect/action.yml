---
name: "Ubuntu Vendor Detection"
description: "Fetches the latest Ubuntu LTS version, validates, updates catalog, and generates structured reports"

inputs:
  vendor:
    description: "Vendor name (ubuntu)"
    required: true

runs:
  using: "composite"
  steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: pip install requests beautifulsoup4 jq
      shell: bash

    # 4️⃣ Prepare directories
    - name: Ensure directories
      run: mkdir -p reports catalog/state
      shell: bash

    # 5️⃣ DETECT
    - name: Run Ubuntu RSS Fetcher
      id: fetch
      run: |
        echo "🔎 Fetching latest Ubuntu LTS release..."
        version=$(python3 connectors/ubuntu/rss_fetcher.py | grep "Latest Ubuntu version detected" | awk -F': ' '{print $2}')
        if [ -z "$version" ]; then
          echo "⚠️  Detection failed; falling back to catalog/state/ubuntu.json"
          if [ -f catalog/state/ubuntu.json ]; then
            version=$(jq -r '.last_version' catalog/state/ubuntu.json)
          else
            version="unknown"
          fi
        fi
        echo "latest_version=$version" >> $GITHUB_OUTPUT
        echo "{\"vendor\": \"ubuntu\", \"detected_version\": \"$version\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > reports/ubuntu-detect.json
        echo "✅ Detected latest Ubuntu version: $version"
      shell: bash

    # 6️⃣ COMPARE / CATALOG UPDATE
    - name: Compare and Update Catalog
      id: update
      run: |
        python3 scripts/compare_versions.py ubuntu "${{ steps.fetch.outputs.latest_version }}"
        cp catalog/state/ubuntu.json reports/ubuntu-catalog.json
        echo "✅ Catalog comparison complete."
      shell: bash

    # 7️⃣ VALIDATE
    - name: Validate Ubuntu image
      id: validate
      run: |
        echo "{\"vendor\": \"ubuntu\", \"validation_status\": \"passed\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > reports/ubuntu-validate.json
        echo "✅ Validation simulated (replace with Trivy scan later)."
      shell: bash

    # 8️⃣ GENERATE SUMMARY
    - name: Generate Ubuntu Summary Report
      id: summary
      run: |
        detect_file="reports/ubuntu-detect.json"
        validate_file="reports/ubuntu-validate.json"
        catalog_file="reports/ubuntu-catalog.json"

        jq -n --arg vendor "ubuntu" \
             --slurpfile detect $detect_file \
             --slurpfile validate $validate_file \
             --slurpfile catalog $catalog_file \
             '{
                vendor: $vendor,
                detect: $detect[0],
                validate: $validate[0],
                catalog: $catalog[0],
                generated_at: (now | todate)
              }' > reports/ubuntu-summary.json

        echo "✅ Summary report created: reports/ubuntu-summary.json"
      shell: bash

    # 9️⃣ UPLOAD REPORTS (collision-proof)
    - name: Upload Ubuntu Reports
      uses: actions/upload-artifact@v4
      with:
        name: reports-${{ inputs.vendor }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.job }}-${{ github.run_id }}
        path: reports/
